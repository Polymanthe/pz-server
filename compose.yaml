services:
  projectzomboid:
    build:
      context: .
      args:
        PZ_BASE_IMAGE: "${PZ_IMAGE:-docker.io/indifferentbroccoli/projectzomboid-server-docker:v1.1.8@sha256:950d7b4ff19a04d3f8a1a35af383526ad95c88a9a4d795760b3a9b00ee80b1a0}"
    image: "${PZ_SERVER_IMAGE:-pz-server:local}"
    platform: linux/amd64
    restart: unless-stopped
    stop_grace_period: 60s
    env_file:
      - ./mods/resolved.env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?Run task init or configure ADMIN_PASSWORD}"
      RCON_PASSWORD: "${RCON_PASSWORD:?Run task init or configure RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT:-27015}"
      SERVER_NAME: "${SERVER_NAME:-pzserver}"
      SERVER_BRANCH: "${SERVER_BRANCH:-}"
      DEFAULT_PORT: "${DEFAULT_PORT:-16261}"
      UDP_PORT: "${UDP_PORT:-16262}"
      SERVER_CONNECT_ADDRESS: "${SERVER_CONNECT_ADDRESS:-}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      PUBLIC_SERVER: "${PUBLIC_SERVER:-false}"
      MEMORY_XMX_GB: "${MEMORY_XMX_GB:-4}"
      MEMORY_XMS_GB: "${MEMORY_XMS_GB:-}"
      VM_ARGS: "${VM_ARGS:-}"
      UPDATE_ON_START: "${UPDATE_ON_START:-false}"
      STEAM_VAC: "${STEAM_VAC:-true}"
      USE_STEAM: "${USE_STEAM:-true}"
    ports:
      - "${DEFAULT_PORT:-16261}:${DEFAULT_PORT:-16261}/udp"
      - "${UDP_PORT:-16262}:${UDP_PORT:-16262}/udp"
    volumes:
      - server-files:/project-zomboid
      - server-data:/project-zomboid-config
    healthcheck:
      test: ["CMD-SHELL", "rcon-cli -c /home/steam/server/rcon.yml players >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # A cold start (empty volumes) redownloads the server and the whole mod
      # pack from Steam before RCON can answer, which takes far longer than a
      # minute. A healthy probe during the start period marks the container up
      # right away, so this costs a warm start nothing. Keep the total budget
      # (start_period + retries * interval) under the Taskfile WAIT_TIMEOUT.
      start_period: 15m
    deploy:
      resources:
        limits:
          cpus: "${CONTAINER_CPU_LIMIT:-4.0}"
          memory: "${CONTAINER_MEMORY_LIMIT:-6G}"
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"

  # The companion site. Enable it with COMPOSE_PROFILES=web in .env so a
  # development host keeps running the game server alone.
  web:
    build:
      context: ./web
    image: "${PZ_WEB_IMAGE:-pz-server-web:local}"
    profiles: ["web"]
    restart: unless-stopped
    environment:
      PZ_RCON_HOST: projectzomboid
      RCON_PASSWORD: "${RCON_PASSWORD:?Run task init or configure RCON_PASSWORD}"
      RCON_PORT: "${RCON_PORT:-27015}"
      SERVER_NAME: "${SERVER_NAME:-pzserver}"
      SERVER_CONNECT_ADDRESS: "${SERVER_CONNECT_ADDRESS:-}"
      DEFAULT_PORT: "${DEFAULT_PORT:-16261}"
      MAX_PLAYERS: "${MAX_PLAYERS:-8}"
      USE_STEAM: "${USE_STEAM:-true}"
      PZ_STEAM_ENRICHMENT: "${PZ_STEAM_ENRICHMENT:-true}"
    volumes:
      # Read-only by construction: this service must never be able to alter the
      # world, the configuration, or the mod pack.
      - server-data:/project-zomboid-config:ro
      - server-files:/project-zomboid:ro
      - web-cache:/var/cache/pz-web
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"

  # World archiving. One-shot by nature: it lives behind its own profile so that
  # task up never starts it, and is only reached through docker compose run. It
  # is the only service allowed to write into server-data besides the game.
  backup:
    build:
      context: ./backup
    image: "${PZ_BACKUP_IMAGE:-pz-server-backup:local}"
    profiles: ["backup"]
    # The active mod pack, recorded in the archive manifest so a restore can
    # warn when the world no longer matches the mods it was saved with.
    env_file:
      - ./mods/resolved.env
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      SERVER_NAME: "${SERVER_NAME:-pzserver}"
      BACKUP_STORE: "${BACKUP_STORE:-local}"
    volumes:
      - server-data:/project-zomboid-config
      # The one bind mount of this deployment: an archive is worthless if it
      # cannot leave the Docker engine that produced it.
      - "${BACKUP_DIR:-./backups}:/backups"
    security_opt:
      - no-new-privileges:true

  caddy:
    image: "${CADDY_IMAGE:-docker.io/library/caddy:2.10-alpine}"
    profiles: ["web"]
    restart: unless-stopped
    depends_on:
      - web
    environment:
      WEB_DOMAIN: "${WEB_DOMAIN:-:80}"
      WEB_LOGS_USER: "${WEB_LOGS_USER:-admin}"
      WEB_LOGS_PASSWORD_HASH: "${WEB_LOGS_PASSWORD_HASH:-}"
      WEB_TRUSTED_PROXIES: "${WEB_TRUSTED_PROXIES:-private_ranges}"
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "${LOG_MAX_SIZE:-10m}"
        max-file: "${LOG_MAX_FILES:-5}"

volumes:
  server-files:
  server-data:
  web-cache:
  caddy-data:
  caddy-config:
